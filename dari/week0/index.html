<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자기소개 카드</title>

    <style>
      .card {
        box-sizing: border-box;
        width: 90%;
        max-width: 560px;
        margin: 40px auto;
        padding: 24px;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
      }

      .card-title {
        color: #e6bba8;
      }

      .card-description {
        color: #312717;
      }

      .skills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .skill {
        padding: 6px 10px;
        background: #eff6ff;
        border-radius: 8px;
      }

      button {
        margin-top: 20px;
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: #e6bba8;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1 class="card-title">안녕하세요, 영은입니다!</h1>
      <p class="card-description">프론트엔드 개발을 공부하고 있어요.</p>

      <div class="skills">
        <span class="skill">HTML</span>
        <span class="skill">CSS</span>
        <span class="skill">JavaScript</span>
      </div>

      <button type="button">반가워요</button>
    </div>
  </body>
</html>
